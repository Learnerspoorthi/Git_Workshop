<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Simple Web Page</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --accent: #2f6fed;
    }
    body.dark {
      --bg: #12161c;
      --card: #1c222b;
      --text: #e6ebf1;
      --muted: #9aa5b1;
      --accent: #6c9bff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      transition: background .3s, color .3s;
    }
    header, main, footer {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-weight: 700; font-size: 1.2rem; }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
    }
    button:hover { opacity: .9; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    h1 { margin-top: 0; font-size: 2rem; }
    p { color: var(--muted); }
    input {
      font: inherit;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--muted);
      background: var(--bg);
      color: var(--text);
      margin-right: 8px;
    }
    #greeting { margin-top: 12px; font-weight: 600; color: var(--text); }
    #count { font-size: 2rem; font-weight: 700; margin: 0 12px; }
    footer { text-align: center; color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">MyPage</div>
    <button id="themeBtn">Dark mode</button>
  </header>

  <main>
    <section class="card">
      <h1>Welcome!</h1>
      <p>This is a simple web page built with HTML, CSS and JavaScript. Edit the text and styles to make it your own.</p>
    </section>

    <section class="card">
      <h2>Say hello</h2>
      <input id="nameInput" type="text" placeholder="Your name" aria-label="Your name">
      <button id="greetBtn">Greet me</button>
      <div id="greeting"></div>
    </section>

    <section class="card">
      <h2>Counter</h2>
      <button id="minus" aria-label="Decrease">−</button>
      <span id="count">0</span>
      <button id="plus" aria-label="Increase">+</button>
    </section>
  </main>

  <footer>&copy; <span id="year"></span> MyPage</footer>

  <script>
    // Dark mode toggle
    const themeBtn = document.getElementById('themeBtn');
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      themeBtn.textContent = document.body.classList.contains('dark') ? 'Light mode' : 'Dark mode';
    });

    // Greeting
    const nameInput = document.getElementById('nameInput');
    const greeting = document.getElementById('greeting');
    function greet() {
      const name = nameInput.value.trim();
      greeting.textContent = name ? `Hello, ${name}! 👋` : 'Please type your name first.';
    }
    document.getElementById('greetBtn').addEventListener('click', greet);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') greet(); });

    // Counter
    let count = 0;
    const countEl = document.getElementById('count');
    document.getElementById('plus').addEventListener('click', () => countEl.textContent = ++count);
    document.getElementById('minus').addEventListener('click', () => countEl.textContent = --count);

    // Footer year
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
